<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GBK Swap</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f5f8f7;
  color:#082b24;
  font-family:Arial,Helvetica,sans-serif;
}
.header{
  background:#06745f;
  color:white;
  padding:22px 20px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
}
.logo{
  width:74px;
  height:74px;
  border-radius:24px;
  background:white;
  color:#08755f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
}
.title{
  font-size:34px;
  font-weight:900;
}
.sub{
  font-size:20px;
  font-weight:700;
  opacity:.9;
  margin-top:5px;
}
.network{
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);

  padding:14px 18px;

  white-space:nowrap;
}
.dot{
  display:inline-block;

  height:12px;
  border-radius:50%;
  background:#52e3ae;

}
.container{
  max-width:720px;
  margin:22px auto 100px;

}
.card{

}
h1{
  margin:0;
  font-size:38px;
}
.caption{
  margin:8px 0 28px;
  color:#7d8785;
  font-size:22px;
  font-weight:700;
}
.walletRow{
  display:flex;
  gap:10px;
  margin-bottom:22px;
}
button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}
.connect{
  flex:1;
  padding:17px;
  border-radius:18px;
  background:#06745f;
  color:white;
  font-size:18px;
  font-weight:800;
}
.disconnect{
  display:none;
  padding:17px;
  border-radius:18px;
  background:#edf3f1;
  color:#075d4e;
  font-weight:800;
}
.address{
  display:none;
  margin-bottom:20px;
  padding:14px 16px;
  background:#f1f7f5;
  border-radius:15px;
  word-break:break-all;
  font-size:14px;
}
.labelRow{
  display:flex;
  justify-content:space-between;
  color:#66716e;
  font-weight:800;
  margin:18px 0 10px;
}
.tokenBox{
  min-height:120px;
  border:1px solid #d8e2df;
  border-radius:27px;
  background:#fbfcfc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 18px 18px 22px;
}
.amount{
  width:55%;
  border:0;
  outline:0;
  background:transparent;
  font-size:35px;
  font-weight:800;
  color:#071e19;
}
.amount::placeholder{color:#a2aaa8}
select{
  appearance:auto;
  min-width:150px;
  border:1px solid #d8e2df;
  border-radius:20px;
  background:white;
  padding:17px;
  font-size:21px;
  font-weight:800;
}
.flip{
  width:58px;
  height:58px;
  border-radius:50%;
  background:#07856b;
  color:white;
  display:block;
  margin:18px auto;
  font-size:28px;
}
.balance{
  font-size:15px;
}
.info{
  margin-top:25px;
  border-top:1px solid #e1e7e5;
  padding-top:20px;
}
.infoLine{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  font-size:18px;
}
.infoLine span:first-child{
  color:#77817f;
  font-weight:700;
}
.infoLine span:last-child{
  font-weight:800;
  text-align:right;
}
.slip{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:8px;
}
.slip button{
  padding:17px;
  border:1px solid #d9e3e0;
  background:white;
  border-radius:18px;
  font-size:18px;
  font-weight:800;
}
.slip button.active{
  background:#087b64;
  color:white;
  border-color:#087b64;
}
.custom{
  width:100%;
  margin-top:12px;
  border:1px solid #d9e3e0;
  border-radius:18px;
  padding:16px;
  font-size:18px;
  outline:none;
}
.swap{
  width:100%;
  margin-top:25px;
  padding:20px;
  border-radius:25px;
  background:#f2b91e;
  color:#101b18;
  font-size:23px;
  font-weight:900;
}
.swap:disabled{
  opacity:.45;
  cursor:not-allowed;
}
.status{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:18px;
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}
.status.ok{display:block;background:#e7f8f1;color:#075d4e}
.status.err{display:block;background:#fff0ef;color:#9d2f2a}
.status.info{display:block;background:#eef5ff;color:#24527b}
.small{
  margin-top:12px;
  color:#7a8582;
  font-size:13px;
  line-height:1.5;
}
@media(max-width:600px){
  .header{padding:18px 14px}
  .logo{width:65px;height:65px}
  .title{font-size:29px}
  .sub{font-size:17px}
  .network{font-size:15px;padding:12px}
  .container{padding:0 10px}
  .card{padding:20px;border-radius:25px}
  h1{font-size:34px}
  .caption{font-size:18px}
  .amount{font-size:29px}
  select{min-width:125px;font-size:18px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="logo">GBK</div>
    <div>
      <div class="title">GBK Swap</div>
      <div class="sub">BNB CHAIN</div>
    </div>
  </div>

  <div class="network">
    <span class="dot"></span>BNB Chain
  </div>
</header>

<main class="container">
<section class="card">

<h1>Swap Tokens</h1>
<div class="caption">PancakeSwap V2 • BNB Smart Chain</div>

<div class="walletRow">
  <button id="connectBtn" class="connect">Connect Wallet</button>
  <button id="disconnectBtn" class="disconnect">Disconnect</button>
</div>

<div id="addressBox" class="address"></div>

<div class="labelRow">
  <span>From</span>
  <span id="fromBalance">Balance: —</span>
</div>

<div class="tokenBox">
  <input id="amountIn"
         class="amount"
         inputmode="decimal"
         placeholder="0"
         autocomplete="off">
  <select id="fromToken">
    <option value="BNB">BNB</option>
    <option value="USDT">USDT</option>
    <option value="GBK">GBK</option>
  </select>
</div>

<button id="flipBtn" class="flip">↕</button>

<div class="labelRow">
  <span>To</span>
  <span id="toBalance">Balance: —</span>
</div>

<div class="tokenBox">
  <div id="amountOut"
       class="amount"
       style="display:flex;align-items:center">
    —
  </div>
  <select id="toToken">
    <option value="GBK">GBK</option>
    <option value="USDT">USDT</option>
    <option value="BNB">BNB</option>
  </select>
</div>

<div class="info">
  <div class="infoLine">
    <span>Rate</span>
    <span id="rate">—</span>
  </div>

  <div class="infoLine">
    <span>Route</span>
    <span id="route">—</span>
  </div>

  <div class="infoLine">
    <span>Slippage</span>
    <span id="slippageText">1%</span>
  </div>
</div>

<div class="slip">
  <button data-slip="0.5">0.5%</button>
  <button data-slip="1" class="active">1%</button>
  <button data-slip="2">2%</button>
  <button data-slip="5">5%</button>
</div>

<input id="customSlip"
       class="custom"
       type="number"
       min="0.1"
       max="5"
       step="0.1"
       placeholder="Custom slippage % (max 5%)">

<button id="swapBtn" class="swap" disabled>
  Connect Wallet
</button>

<div id="status" class="status"></div>

<div class="small">
  WBNB is used internally only when required by the V2 route.
  It is intentionally hidden from the token selector.
</div>

</section>
</main>

<script>
"use strict";

/* =========================================================
   GBK SWAP — BNB CHAIN / PANCAKESWAP V2
   ========================================================= */

const CHAIN_ID = 56;

const ROUTER = "0x10ED43C718714eb63d5aA57B78B54704E256024E";
const WBNB   = "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c";
const USDT   = "0x55d398326f99059fF775485246999027B3197955";
const GBK    = "0xD41767498d36c271f805cA1EfF7Cefd2EB9F7461";

const BSC_RPC = "https://bsc-dataseed.binance.org";

const ERC20_ABI = [
  "function balanceOf(address) view returns (uint256)",
  "function decimals() view returns (uint8)",
  "function symbol() view returns (string)",
  "function allowance(address,address) view returns (uint256)",
  "function approve(address,uint256) returns (bool)"
];

const ROUTER_ABI = [
  "function getAmountsOut(uint256 amountIn,address[] memory path) view returns (uint256[] memory amounts)",

  "function swapExactETHForTokensSupportingFeeOnTransferTokens(uint256 amountOutMin,address[] calldata path,address to,uint256 deadline) payable",

  "function swapExactTokensForETHSupportingFeeOnTransferTokens(uint256 amountIn,uint256 amountOutMin,address[] calldata path,address to,uint256 deadline)",

  "function swapExactTokensForTokensSupportingFeeOnTransferTokens(uint256 amountIn,uint256 amountOutMin,address[] calldata path,address to,uint256 deadline)"
];

let provider = null;
let signer = null;
let account = null;
let slippage = 1;
let currentQuote = null;

const $ = id => document.getElementById(id);

const connectBtn = $("connectBtn");
const disconnectBtn = $("disconnectBtn");
const addressBox = $("addressBox");
const amountIn = $("amountIn");
const amountOut = $("amountOut");
const fromToken = $("fromToken");
const toToken = $("toToken");
const swapBtn = $("swapBtn");
const statusBox = $("status");
const routeBox = $("route");
const rateBox = $("rate");

function showStatus(message,type="info"){
  statusBox.className = "status " + type;
  statusBox.textContent = message;
}

function clearStatus(){
  statusBox.className = "status";
  statusBox.textContent = "";
}

function shortAddress(a){
  return a.slice(0,6) + "..." + a.slice(-4);
}

function tokenAddress(symbol){
  if(symbol === "USDT") return USDT;
  if(symbol === "GBK") return GBK;
  if(symbol === "BNB") return null;
  return null;
}

function pathFor(from,to){
  if(from === to) return null;

  /* Native BNB internally uses WBNB */
  if(from === "BNB" && to === "GBK")
    return [WBNB, GBK];

  if(from === "GBK" && to === "BNB")
    return [GBK, WBNB];

  if(from === "BNB" && to === "USDT")
    return [WBNB, USDT];

  if(from === "USDT" && to === "BNB")
    return [USDT, WBNB];

  if(from === "USDT" && to === "GBK")
    return [USDT, WBNB, GBK];

  if(from === "GBK" && to === "USDT")
    return [GBK, WBNB, USDT];

  return null;
}

function routeText(path){
  if(!path) return "—";

  const names = path.map(x=>{
    if(x.toLowerCase() === WBNB.toLowerCase()) return "WBNB";
    if(x.toLowerCase() === USDT.toLowerCase()) return "USDT";
    if(x.toLowerCase() === GBK.toLowerCase()) return "GBK";
    return x;
  });

  /* Hide WBNB from displayed route */
  return names.filter(x=>x !== "WBNB").join(" → ");
}

async function ensureProvider(){
  if(!window.ethereum){
    throw new Error(
      "No browser wallet detected. Open swap.gbkai.com inside a BNB Chain compatible wallet browser."
    );
  }

  provider = new ethers.BrowserProvider(window.ethereum);

  const network = await provider.getNetwork();

  if(Number(network.chainId) !== CHAIN_ID){
    try{
      await window.ethereum.request({
        method:"wallet_switchEthereumChain",
        params:[{chainId:"0x38"}]
      });
    }catch(e){

      if(e.code === 4902){
        await window.ethereum.request({
          method:"wallet_addEthereumChain",
          params:[{
            chainId:"0x38",
            chainName:"BNB Smart Chain",
            nativeCurrency:{
              name:"BNB",
              symbol:"BNB",
              decimals:18
            },
            rpcUrls:[BSC_RPC],
            blockExplorerUrls:["https://bscscan.com"]
          }]
        });
      }else{
        throw e;
      }
    }

    provider = new ethers.BrowserProvider(window.ethereum);
  }
}

async function connectWallet(){
  try{
    clearStatus();

    await ensureProvider();

    const accounts = await provider.send(
      "eth_requestAccounts",
      []
    );

    if(!accounts.length) throw new Error("Wallet connection was cancelled.");

    account = accounts[0];
    signer = await provider.getSigner();

    addressBox.style.display = "block";
    addressBox.textContent = "Connected: " + shortAddress(account);

    connectBtn.style.display = "none";
    disconnectBtn.style.display = "block";

    swapBtn.disabled = false;
    swapBtn.textContent = "Enter amount";

    await refreshBalances();
    showStatus("Wallet connected on BNB Chain.","ok");

  }catch(e){
    showStatus(cleanError(e),"err");
  }
}

function disconnectWallet(){
  account = null;
  signer = null;

  addressBox.style.display = "none";
  connectBtn.style.display = "block";
  disconnectBtn.style.display = "none";

  $("fromBalance").textContent = "Balance: —";
  $("toBalance").textContent = "Balance: —";

  swapBtn.disabled = true;
  swapBtn.textContent = "Connect Wallet";

  amountOut.textContent = "—";
  rateBox.textContent = "—";
  routeBox.textContent = "—";

  currentQuote = null;
}

function cleanError(e){

  if(!e) return "Unknown error.";

  if(e.code === 4001)
    return "Transaction cancelled in wallet.";

  if(e.code === "ACTION_REJECTED")
    return "Transaction cancelled in wallet.";

  if(e.code === "INSUFFICIENT_FUNDS")
    return "Insufficient BNB for the swap and network fee.";

  if(e.message){
    if(e.message.includes("missing revert data"))
      return "The route has no usable liquidity or the router rejected the call. No transaction was sent.";

    if(e.message.includes("CALL_EXCEPTION"))
      return "PancakeSwap could not quote this route. No transaction was sent.";

    return e.message.slice(0,500);
  }

  return String(e).slice(0,500);
}

async function getTokenBalance(symbol){

  if(!account) return null;

  if(symbol === "BNB"){
    const bal = await provider.getBalance(account);
    return ethers.formatEther(bal);
  }

  const token = new ethers.Contract(
    tokenAddress(symbol),
    ERC20_ABI,
    provider
  );

  const decimals = Number(await token.decimals());
  const bal = await token.balanceOf(account);

  return ethers.formatUnits(bal,decimals);
}

async function refreshBalances(){

  if(!account) return;

  try{
    const a = await getTokenBalance(fromToken.value);
    const b = await getTokenBalance(toToken.value);

    $("fromBalance").textContent =
      "Balance: " + Number(a).toLocaleString(undefined,{
        maximumFractionDigits:8
      });

    $("toBalance").textContent =
      "Balance: " + Number(b).toLocaleString(undefined,{
        maximumFractionDigits:8
      });

  }catch(e){
    console.error(e);
  }
}

async function getDecimals(symbol){

  if(symbol === "BNB") return 18;

  const token = new ethers.Contract(
    tokenAddress(symbol),
    ERC20_ABI,
    provider
  );

  return Number(await token.decimals());
}

function calculateMinimum(amount, slipPercent){

  const multiplier =
    1 - (Number(slipPercent) / 100);

  return amount * BigInt(
    Math.floor(multiplier * 1000000)
  ) / 1000000n;
}

async function quote(){

  currentQuote = null;

  if(!account){
    swapBtn.disabled = true;
    swapBtn.textContent = "Connect Wallet";
    return;
  }

  const value = amountIn.value.trim();

  if(!value || Number(value) <= 0){
    amountOut.textContent = "—";
    routeBox.textContent = "—";
    rateBox.textContent = "—";
    swapBtn.disabled = false;
    swapBtn.textContent = "Enter amount";
    return;
  }

  const from = fromToken.value;
  const to = toToken.value;

  if(from === to){
    amountOut.textContent = "—";
    routeBox.textContent = "Same token";
    rateBox.textContent = "—";
    swapBtn.disabled = true;
    swapBtn.textContent = "Choose different tokens";
    return;
  }

  const path = pathFor(from,to);

  if(!path){
    swapBtn.disabled = true;
    swapBtn.textContent = "Unsupported route";
    return;
  }

  try{

    showStatus("Checking PancakeSwap V2 liquidity…","info");

    const decimalsIn = await getDecimals(from);
    const decimalsOut = await getDecimals(to);

    const inputWei = ethers.parseUnits(
      value,
      decimalsIn
    );

    if(inputWei <= 0n)
      throw new Error("Invalid amount.");

    const router = new ethers.Contract(
      ROUTER,
      ROUTER_ABI,
      provider
    );

    const amounts = await router.getAmountsOut(
      inputWei,
      path
    );

    const outputWei = amounts[amounts.length - 1];

    if(outputWei <= 0n)
      throw new Error("No liquidity available.");

    const outputHuman = ethers.formatUnits(
      outputWei,
      decimalsOut
    );

    amountOut.textContent =
      Number(outputHuman).toLocaleString(undefined,{
        maximumFractionDigits:8
      });

    const rate =
      Number(outputHuman) / Number(value);

    rateBox.textContent =
      "1 " + from + " ≈ " +
      rate.toLocaleString(undefined,{
        maximumFractionDigits:8
      }) + " " + to;

    routeBox.textContent = routeText(path);

    currentQuote = {
      from,
      to,
      path,
      inputWei,
      outputWei,
      decimalsIn,
      decimalsOut
    };

    swapBtn.disabled = false;
    swapBtn.textContent =
      from === "BNB"
      ? "Swap BNB → " + to
      : "Swap " + from + " → " + to;

    clearStatus();

  }catch(e){

    amountOut.textContent = "No liquidity";
    rateBox.textContent = "—";
    routeBox.textContent = routeText(path);

    currentQuote = null;

    swapBtn.disabled = true;
    swapBtn.textContent = "No liquidity";

    showStatus(
      "No executable PancakeSwap V2 route was found for this amount. No transaction was sent.",
      "err"
    );
  }
}

async function approveIfNeeded(token, amount){

  const contract = new ethers.Contract(
    token,
    ERC20_ABI,
    signer
  );

  const allowance = await contract.allowance(
    account,
    ROUTER
  );

  if(allowance >= amount)
    return;

  showStatus(
    "Approval required. Confirm the token approval in your wallet.",
    "info"
  );

  const tx = await contract.approve(
    ROUTER,
    ethers.MaxUint256
  );

  showStatus(
    "Approval submitted. Waiting for confirmation…",
    "info"
  );

  await tx.wait();
}

async function executeSwap(){

  if(!currentQuote){
    await quote();
    if(!currentQuote) return;
  }

  if(!signer){
    showStatus("Connect your wallet first.","err");
    return;
  }

  const {
    from,
    to,
    path,
    inputWei,
    outputWei
  } = currentQuote;

  try{

    swapBtn.disabled = true;
    swapBtn.textContent = "Preparing…";

    /* Re-quote immediately before signing.
       This prevents stale output data. */
    const routerRead = new ethers.Contract(
      ROUTER,
      ROUTER_ABI,
      provider
    );

    const freshAmounts =
      await routerRead.getAmountsOut(
        inputWei,
        path
      );

    const freshOutput =
      freshAmounts[freshAmounts.length - 1];

    const minOutput =
      freshOutput -
      (freshOutput * BigInt(
        Math.round(slippage * 100)
      )) / 10000n;

    if(minOutput <= 0n)
      throw new Error("Invalid minimum output.");

    /* ERC20 input */
    if(from !== "BNB"){

      await approveIfNeeded(
        tokenAddress(from),
        inputWei
      );
    }

    const router = new ethers.Contract(
      ROUTER,
      ROUTER_ABI,
      signer
    );

    const deadline =
      Math.floor(Date.now()/1000) + 1200;

    let tx;

    if(from === "BNB"){

      tx =
        await router.swapExactETHForTokensSupportingFeeOnTransferTokens(
          minOutput,
          path,
          account,
          deadline,
          {
            value: inputWei
          }
        );

    }else if(to === "BNB"){

      tx =
        await router.swapExactTokensForETHSupportingFeeOnTransferTokens(
          inputWei,
          minOutput,
          path,
          account,
          deadline
        );

    }else{

      tx =
        await router.swapExactTokensForTokensSupportingFeeOnTransferTokens(
          inputWei,
          minOutput,
          path,
          account,
          deadline
        );
    }

    showStatus(
      "Swap transaction submitted. Waiting for confirmation…\n" +
      tx.hash,
      "info"
    );

    await tx.wait();

    showStatus(
      "Swap confirmed successfully.\n" +
      "Transaction: " + tx.hash,
      "ok"
    );

    amountIn.value = "";
    amountOut.textContent = "—";
    rateBox.textContent = "—";
    currentQuote = null;

    await refreshBalances();

    swapBtn.disabled = false;
    swapBtn.textContent = "Enter amount";

  }catch(e){

    console.error(e);

    swapBtn.disabled = false;
    swapBtn.textContent = "Try Again";

    showStatus(
      cleanError(e),
      "err"
    );
  }
}

/* =========================================================
   EVENTS
   ========================================================= */

connectBtn.addEventListener(
  "click",
  connectWallet
);

disconnectBtn.addEventListener(
  "click",
  disconnectWallet
);

amountIn.addEventListener(
  "input",
  ()=>{
    clearTimeout(window.quoteTimer);
    window.quoteTimer =
      setTimeout(quote,500);
  }
);

fromToken.addEventListener(
  "change",
  async ()=>{
    await refreshBalances();
    await quote();
  }
);

toToken.addEventListener(
  "change",
  async ()=>{
    await refreshBalances();
    await quote();
  }
);

swapBtn.addEventListener(
  "click",
  executeSwap
);

$("flipBtn").addEventListener(
  "click",
  async ()=>{
    const a = fromToken.value;
    fromToken.value = toToken.value;
    toToken.value = a;

    await refreshBalances();
    await quote();
  }
);

document.querySelectorAll(
  ".slip button"
).forEach(button=>{
  button.addEventListener(
    "click",
    ()=>{
      document.querySelectorAll(
        ".slip button"
      ).forEach(b=>b.classList.remove("active"));

      button.classList.add("active");

      slippage =
        Number(button.dataset.slip);

      $("slippageText").textContent =
        slippage + "%";

      $("customSlip").value = "";

      if(currentQuote) quote();
    }
  );
});

$("customSlip").addEventListener(
  "input",
  ()=>{
    let v = Number($("customSlip").value);

    if(!v) return;

    if(v > 5){
      v = 5;
      $("customSlip").value = "5";
    }

    if(v < 0.1){
      v = 0.1;
    }

    slippage = v;

    document.querySelectorAll(
      ".slip button"
    ).forEach(b=>b.classList.remove("active"));

    $("slippageText").textContent =
      slippage + "%";

    if(currentQuote) quote();
  }
);

/* Wallet account/network changes */
if(window.ethereum){

  window.ethereum.on(
    "accountsChanged",
    async accounts=>{
      if(!accounts.length){
        disconnectWallet();
        return;
      }

      account = accounts[0];

      provider =
        new ethers.BrowserProvider(
          window.ethereum
        );

      signer =
        await provider.getSigner();

      addressBox.style.display = "block";
      addressBox.textContent =
        "Connected: " + shortAddress(account);

      await refreshBalances();
      await quote();
    }
  );

  window.ethereum.on(
    "chainChanged",
    ()=>{
      window.location.reload();
    }
  );
}

</script>
</body>
</html>
