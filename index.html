<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d18">
<meta name="description" content="GBK Swap — simple global GBK trading on BNB Chain.">
<title>GBK Swap — BNB Chain</title>

<style>
:root{
  --navy:#071d18;
  --navy2:#0b2b24;
  --green:#087a5b;
  --green2:#10a878;
  --mint:#e8f7f1;
  --gold:#f2c94c;
  --text:#10231f;
  --muted:#6b7d77;
  --line:#e4ebe8;
  --bg:#f5f8f7;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.top{
  background:var(--navy);
  color:white;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
}

.logo{
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(145deg,#10a878,#04583f);
  display:grid;
  place-items:center;
  box-shadow:
    inset 0 0 0 1px #ffffff30,
    0 5px 16px #00000025;
}

.logo span{
  font-size:12px;
  font-weight:900;
}

.network{
  font-size:12px;
  color:#c2ded6;
  border:1px solid #ffffff25;
  border-radius:999px;
  padding:9px 12px;
}

.network-dot{
  color:#79e0bd;
  margin-right:5px;
}

main{
  max-width:1100px;
  margin:0 auto;
  padding:28px 18px 60px;
}

.hero{
  background:
    radial-gradient(circle at 90% 10%,#19a87b33,transparent 35%),
    linear-gradient(135deg,var(--navy),#07583f);
  border-radius:28px;
  padding:30px;
  color:white;
  display:flex;
  justify-content:space-between;
  gap:28px;
  align-items:end;
  box-shadow:0 18px 45px #071d1818;
}

.eyebrow{
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#a9d9cc;
  font-weight:800;
}

.hero h1{
  font-size:clamp(32px,6vw,54px);
  line-height:1;
  margin:10px 0 14px;
  letter-spacing:-1.5px;
}

.hero p{
  margin:0;
  color:#c5e0d8;
  max-width:620px;
  line-height:1.55;
}

.wallet{
  background:var(--gold);
  border:0;
  color:#17251f;
  font-weight:850;
  border-radius:13px;
  padding:14px 20px;
  white-space:nowrap;
  min-width:160px;
  box-shadow:0 7px 18px #00000018;
}

.wallet:hover{
  filter:brightness(.97);
}

.tabs{
  display:flex;
  gap:8px;
  margin:22px 0;
}

.tab{
  border:1px solid var(--line);
  background:white;
  padding:11px 18px;
  border-radius:999px;
  color:#4b625b;
  font-weight:750;
}

.tab.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1.1fr) minmax(280px,.7fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 30px #10231f08;
}

.card h2{
  margin:0 0 5px;
  font-size:21px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

.swapbox{
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  margin:10px 0;
  background:#fbfcfc;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.label{
  font-size:12px;
  color:var(--muted);
  font-weight:750;
}

.balance{
  font-size:12px;
  color:var(--muted);
}

.amount{
  width:100%;
  min-width:0;
  border:0;
  outline:0;
  font-size:29px;
  font-weight:750;
  color:var(--text);
  background:transparent;
  padding:8px 0;
}

.amount::placeholder{
  color:#bdc8c4;
}

.token{
  border:1px solid var(--line);
  background:#f5f8f7;
  border-radius:12px;
  padding:10px 12px;
  font-weight:800;
  min-width:105px;
  color:var(--text);
}

.token.green{
  background:var(--mint);
  color:#075f48;
}

.flip{
  width:42px;
  height:42px;
  border-radius:50%;
  border:4px solid white;
  background:var(--navy);
  color:white;
  display:block;
  margin:-2px auto;
  position:relative;
  z-index:2;
  font-size:18px;
}

.quote{
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-top:1px solid var(--line);
  margin-top:15px;
  padding-top:14px;
  font-size:13px;
}

.muted{
  color:var(--muted);
}

.primary{
  width:100%;
  border:0;
  border-radius:14px;
  background:var(--green);
  color:white;
  font-weight:850;
  padding:15px;
  margin-top:16px;
}

.primary:hover{
  background:#06684d;
}

.info{
  background:var(--mint);
  border:1px solid #ccecdf;
  border-radius:16px;
  padding:14px;
  margin-top:16px;
  font-size:13px;
  line-height:1.45;
  color:#145844;
}

.sideitem{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.sideitem:last-of-type{
  border-bottom:0;
}

.dot
